[workspace]
members = [".", "crates/libuvc-sys"]
exclude = ["crates/winit"]

# Fixes window growth when dragging across monitors with different DPI.
# See crates/winit/PATCHES.md. Remove once eframe uses winit 0.31 or later.
[patch.crates-io]
winit = { path = "crates/winit" }

[package]
name = "thermalview"
version = "0.1.0"
edition = "2021"
description = "Thermal viewer and measurement tool for PureThermal + FLIR Lepton 3.5"
publish = false

[dependencies]
libuvc-sys = { path = "crates/libuvc-sys" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui_plot = "0.38"
flate2 = "1"
ab_glyph = "0.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[profile.release]
debug = "line-tables-only"
